services:
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  ollama-models:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "ollama pull qwen2.5:7b-instruct && ollama pull qwen2.5:14b-instruct"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      ollama-models:
        condition: service_completed_successfully
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - .:/app
    working_dir: /app
    stdin_open: true
    tty: true

volumes:
  ollama_data:
